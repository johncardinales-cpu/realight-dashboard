name: Inventory Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/inventory-quantity-adjustments]

permissions:
  contents: read

jobs:
  stock-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify inventory arithmetic
        run: npm run test:stock
      - name: Type check
        run: npx tsc --noEmit
